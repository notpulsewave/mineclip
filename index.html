<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        :root { --main-red: #ff0000; --bg-black: #121212; --text-gray: #ccc; }
        body { background: var(--bg-black); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: var(--main-red); margin-bottom: 5px; letter-spacing: 2px; }
        .editor-container { border: 1px solid #333; padding: 20px; border-radius: 10px; width: 600px; background: #1a1a1a; }
        .status-box { background: #000; padding: 10px; border-left: 4px solid var(--main-red); margin: 15px 0; font-size: 0.9em; }
        button { background: var(--main-red); color: white; border: none; padding: 12px 20px; cursor: pointer; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        button:disabled { background: #444; cursor: not-allowed; }
        #preview { width: 100%; margin-top: 10px; border: 1px solid var(--main-red); display: none; }
    </style>
</head>
<body>
    <h1>MINECLIP</h1>
    
    <div class="editor-container">
        <div id="status" class="status-box">Status: Please calibrate your resolution to begin.</div>
        
        <button id="checkBtn">Calibrate</button>
        <button id="startBtn" disabled>Start Recording</button>
        <button id="stopBtn" disabled>Stop Recording</button>

        <video id="preview" autoplay muted></video>
    </div>

    <script>
        let mediaRecorder, stream;
        const statusDiv = document.getElementById('status');
        const checkBtn = document.getElementById('checkBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const preview = document.getElementById('preview');

        // Resolution Tester
        checkBtn.onclick = async () => {
            statusDiv.innerText = "Testing resolution...";
            try {
                const testStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: 4096 }, height: { ideal: 2160 } }
                });
                const settings = testStream.getVideoTracks()[0].getSettings();
                testStream.getTracks().forEach(t => t.stop());
                
                statusDiv.innerHTML = `Detected: ${settings.width}x${settings.height}<br>` +
                                     (settings.width >= 1920 ? "✅ 1080p Ready" : "⚠️ Low resolution detected");
                startBtn.disabled = false;
            } catch (e) {
                statusDiv.innerText = "Error: Permission denied.";
            }
        };

        // Start Recording
        startBtn.onclick = async () => {
            stream = await navigator.mediaDevices.getDisplayMedia({
                video: { width: { ideal: 1920 }, height: { ideal: 1080 } }
            });
            preview.srcObject = stream;
            preview.style.display = 'block';
            
            let chunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'mineclip_recording.webm';
                a.click();
            };
            
            mediaRecorder.start();
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDiv.innerText = "Status: Recording... (Look for the red border)";
        };

        stopBtn.onclick = () => {
            mediaRecorder.stop();
            stream.getTracks().forEach(t => t.stop());
            preview.style.display = 'none';
            stopBtn.disabled = true;
            startBtn.disabled = false;
            statusDiv.innerText = "Status: Saved!";
        };
    </script>
</body>
</html>
